<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>خلاصه اخبار</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #E1EFEB; color: #1B2230;
           font-family: system-ui, 'Segoe UI', Tahoma, sans-serif; }
    .box { text-align: center; padding: 24px; }
    button { margin-top: 14px; border: 0; border-radius: 12px; padding: 10px 22px; font: inherit; font-weight: 700;
             background: #047D58; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <div class="box">
    <p>اینترنت وصل نیست.</p>
    <button onclick="location.href = new URLSearchParams(location.search).get('url')">دوباره امتحان کن</button>
  </div>
</body>
</html>
