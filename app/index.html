<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>خلاصه اخبار</title>
  <meta name="description" content="آخرین اخبار اقتصادی، سیاسی، ورزشی، فناوری و قیمت طلا و ارز">
  <meta name="theme-color" content="#E5484D">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="خلاصه اخبار">
  <link rel="stylesheet" href="app.css">
  <script src="themes.js"></script>
  <script src="theme.js"></script>
</head>
<body>
  <main>
    <header id="hero" class="hero">
      <button id="back" class="icon-btn" aria-label="بازگشت" hidden>
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="titles">
        <h1 id="title">خلاصه اخبار</h1>
        <p id="updated" class="updated">در حال بارگذاری…</p>
      </div>
      <button id="theme-btn" class="icon-btn" aria-label="تم‌ها">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.7-.9 1.7-1.8 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.8 1.8-1.8H16a5 5 0 0 0 5-5c0-3.9-4-7-9-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="7.5" cy="11" r="1.4" fill="currentColor"/><circle cx="10.5" cy="7.2" r="1.4" fill="currentColor"/><circle cx="15" cy="7.6" r="1.4" fill="currentColor"/></svg>
      </button>
      <button id="refresh" class="icon-btn" aria-label="به‌روزرسانی">
        <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <section id="menu" class="menu" aria-label="دسته‌ها"></section>
    <section id="section" class="section" hidden></section>

    <div id="install" class="install" hidden>
      <p id="install-text"></p>
      <button id="install-btn" class="install-btn" hidden>نصب اپ</button>
      <button id="install-close" class="link-btn">بستن</button>
    </div>

    <a id="report-link" class="report-link" href="report.html">📄 گزارش کامل ساعتی (با تحلیل و نمودار)</a>
    <a id="downloads" class="report-link" href="https://github.com/3omid/persian-news-digest/releases/latest" target="_blank" rel="noopener">⬇️ دانلود نسخه‌ی اندروید و ویندوز</a>
  </main>

  <div id="picker" class="picker" hidden>
    <div class="picker-frame" aria-hidden="true"></div>
    <div class="picker-bar">
      <div class="picker-row">
        <button id="pk-cancel" class="pill">لغو</button>
        <button id="pk-prev" class="arrow" aria-label="قبلی">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="pk-name-wrap">
          <div id="pk-name" class="pk-name"></div>
          <div id="pk-count" class="pk-count" dir="ltr"></div>
        </div>
        <button id="pk-next" class="arrow" aria-label="بعدی">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="pk-apply" class="pill main">اعمال</button>
      </div>
      <div class="seg" role="radiogroup" aria-label="حالت نمایش">
        <button data-mode="light">☀️ روشن</button>
        <button data-mode="dark">🌙 تیره</button>
        <button data-mode="auto">🌗 خودکار</button>
      </div>
      <p class="pk-hint">برای دیدن تم‌ها، صفحه رو به چپ و راست بکش</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
