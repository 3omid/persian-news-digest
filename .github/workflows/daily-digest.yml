name: Persian News Digest

on:
  schedule:
    # سر هر ساعت: گزارش کامل (اگه خبر جدیدی نباشه، main.py خودش گزارش نمی‌سازه) + داده‌ی اپ
    - cron: "0 * * * *"
    # هر ۱۵ دقیقه بین ساعت‌ها: فقط داده‌ی اپ موبایل (آخرین خبرها/قیمت‌ها) تازه می‌شه - بدون هزینه‌ی هوش مصنوعی
    - cron: "15,30,45 * * * *"
  workflow_dispatch:
    inputs:
      category:
        description: "فقط یک دسته خاص بساز (خالی = همه دسته‌ها)"
        required: false
        type: choice
        options:
          - "(همه)"
          - "اقتصادی"
          - "سیاسی داخلی"
          - "سیاسی خارجی"
          - "ورزشی"
          - "جنگ ایران"
        default: "(همه)"
      force:
        description: "حتی بدون خبر جدید هم گزارش بساز"
        required: false
        type: boolean
        default: true

# این دو خط اجازه می‌ده workflow بتونه رو GitHub Pages پابلیش کنه
permissions:
  contents: read
  pages: write
  id-token: write

# اسم گروه عوض شد: از حدود ۳۰ سپتامبر همه‌ی اجراها تو گروه قبلی ("pages") بدون شروع هیچ
# job ای «pending» می‌موندن تا اجرای بعدی جاشون رو بگیره (یک جای گیرکرده تو صف خودِ گیت‌هاب) -
# برای همین سایت سه هفته به‌روز نشده بود. گروه تازه از اون صف گیرکرده جداست.
concurrency:
  group: news-site-deploy
  cancel-in-progress: false

jobs:
  build-and-send:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore seen_news.db (cache)
        uses: actions/cache@v4
        with:
          path: seen_news.db
          key: seen-news-db-${{ github.run_id }}
          restore-keys: |
            seen-news-db-

      # آخرین گزارش ساخته‌شده کش می‌شه تا اجراهای «فقط اپ» (و ساعت‌هایی که خبر جدیدی نبوده)
      # هم بتونن همون گزارش قبلی رو کنار اپ منتشر کنن، نه این‌که لینک گزارش خراب بشه.
      - name: Restore latest report (cache)
        uses: actions/cache@v4
        with:
          path: output/latest.html
          key: latest-report-${{ github.run_id }}
          restore-keys: |
            latest-report-

      - name: Run digest (scheduled)
        if: github.event_name == 'schedule' && github.event.schedule == '0 * * * *'
        env:
          MODEL_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
        run: python main.py

      - name: Run digest (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        env:
          MODEL_PROVIDER: gemini
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
        run: |
          ARGS=""
          if [ "${{ inputs.category }}" != "(همه)" ] && [ -n "${{ inputs.category }}" ]; then
            ARGS="$ARGS --category \"${{ inputs.category }}\""
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          eval python main.py $ARGS

      - name: Build mobile app data
        env:
          GOLD_API_KEY: ${{ secrets.GOLD_API_KEY }}
        run: python build_app_data.py app/data.json

      - name: Upload report as artifact (دانلود دستی از تب Actions)
        uses: actions/upload-artifact@v4
        with:
          name: news-digest-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore

      - name: Prepare GitHub Pages files
        run: |
          mkdir -p pages_output
          # صفحه‌ی اصلی سایت = اپ موبایل؛ گزارش کامل ساعتی تو report.html
          cp -r app/. pages_output/
          if [ -f output/latest.html ]; then
            cp output/latest.html pages_output/report.html
          else
            printf '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش</title><p dir="rtl" style="font-family:Tahoma,sans-serif;padding:24px">گزارش کامل هنوز ساخته نشده - سر ساعت بعد دوباره سر بزن. <a href="./">برگشت به اپ</a></p>' > pages_output/report.html
          fi
          # فونت سلف‌هاست‌شده (فعلا Vazirmatn، هرچی که در آینده جایگزینش بشه - assets/fonts)
          # هم باید کنار index.html منتشر بشه، وگرنه CSS داخل گزارش که به مسیر نسبی
          # assets/fonts/... اشاره می‌کنه رو GitHub Pages به ۴۰۴ می‌خوره و گزارش دوباره
          # به فونت fallback سیستم برمی‌گرده.
          cp -r assets pages_output/assets

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
