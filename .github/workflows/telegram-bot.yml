name: Telegram Bot Listener

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  poll-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Poll Telegram for new messages/clicks
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot_handler.py

      - name: Commit updated subscriber list (if changed)
        run: |
          git config user.name "news-digest-bot"
          git config user.email "actions@github.com"
          git add bot_state.json
          git diff --staged --quiet || git commit -m "Update bot subscribers/state [skip ci]"
          git push || echo "Nothing to push"
